<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="contactTitle">
  <title id="contactTitle">Bright, freshly cleaned living space ready for a new visit</title>
  <rect width="800" height="600" fill="#F4F6F1"/>
  <rect width="800" height="420" fill="#EAEFE7"/>

  <!-- large window -->
  <rect x="470" y="50" width="260" height="330" rx="10" fill="#FDF6E3"/>
  <line x1="600" y1="50" x2="600" y2="380" stroke="#1C2521" stroke-opacity="0.1" stroke-width="4"/>
  <line x1="470" y1="215" x2="730" y2="215" stroke="#1C2521" stroke-opacity="0.1" stroke-width="4"/>

  <!-- sofa -->
  <rect x="70" y="260" width="280" height="140" rx="26" fill="#2F7A6B"/>
  <rect x="70" y="236" width="280" height="55" rx="22" fill="#204F45"/>
  <rect x="95" y="285" width="70" height="60" rx="16" fill="#7FC4B4"/>
  <rect x="255" y="285" width="70" height="60" rx="16" fill="#E8623C" opacity="0.85"/>

  <!-- coffee table -->
  <rect x="130" y="420" width="180" height="16" rx="6" fill="#204F45"/>
  <rect x="150" y="436" width="10" height="60" fill="#204F45"/>
  <rect x="270" y="436" width="10" height="60" fill="#204F45"/>

  <!-- plant -->
  <rect x="400" y="330" width="60" height="70" rx="10" fill="#204F45"/>
  <g fill="#7FC4B4">
    <ellipse cx="420" cy="300" rx="22" ry="38" transform="rotate(-16 420 300)"/>
    <ellipse cx="448" cy="296" rx="20" ry="36" transform="rotate(12 448 296)"/>
    <ellipse cx="434" cy="278" rx="18" ry="34"/>
  </g>

  <!-- floor -->
  <rect x="0" y="420" width="800" height="180" fill="#DCE3D8"/>

  <!-- fresh light sparkle streaks -->
  <g stroke="#E8623C" stroke-width="5" stroke-linecap="round" opacity="0.6" fill="none">
    <path d="M560 440 C 600 420, 640 430, 680 410"/>
  </g>
  <g fill="#FFFFFF">
    <circle cx="600" cy="150" r="5"/>
    <circle cx="640" cy="130" r="3.5"/>
    <circle cx="580" cy="180" r="3"/>
  </g>

  <!-- open book / cushion detail on table -->
  <rect x="170" y="410" width="46" height="10" rx="3" fill="#E3EEE9"/>
</svg>
