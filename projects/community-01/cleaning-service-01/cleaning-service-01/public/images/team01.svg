<svg viewBox="0 0 800 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="teamTitle">
  <title id="teamTitle">Two Brightside team members smiling before a shift</title>
  <rect width="800" height="640" fill="#F4F6F1"/>
  <circle cx="400" cy="260" r="260" fill="#EAEFE7"/>

  <!-- ground -->
  <rect x="0" y="470" width="800" height="170" fill="#DCE3D8"/>

  <!-- decorative wipe streak -->
  <path d="M60 200 C 160 160, 240 160, 320 200 C 420 246, 500 246, 620 190" stroke="#7FC4B4" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.5"/>

  <!-- figure A -->
  <g>
    <path d="M240 640 L240 490 C240 440 280 410 322 410 C364 410 404 440 404 490 L404 640 Z" fill="#2F7A6B"/>
    <path d="M270 448 L376 448 L367 590 L281 590 Z" fill="#E3EEE9"/>
    <circle cx="322" cy="392" r="50" fill="#D9A876"/>
    <path d="M275 378 a50 50 0 0 1 96 0 q-4 -24 -48 -24 t-48 24 z" fill="#1C2521"/>
    <!-- friendly smile -->
    <path d="M300 405 q22 16 44 0" stroke="#1C2521" stroke-width="4" fill="none" stroke-linecap="round"/>
    <!-- crossed-arm confident pose -->
    <path d="M275 450 C 300 470, 344 470, 369 450" stroke="#204F45" stroke-width="20" stroke-linecap="round" fill="none"/>
  </g>

  <!-- figure B -->
  <g>
    <path d="M420 640 L420 500 C420 452 458 424 498 424 C538 424 576 452 576 500 L576 640 Z" fill="#204F45"/>
    <path d="M448 460 L548 460 L540 595 L458 595 Z" fill="#E3EEE9"/>
    <circle cx="498" cy="406" r="48" fill="#D9A876"/>
    <path d="M453 392 a48 48 0 0 1 92 0 q-4 -23 -46 -23 t-46 23 z" fill="#1C2521"/>
    <path d="M478 420 q20 15 40 0" stroke="#1C2521" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M453 463 C 476 482, 518 482, 543 463" stroke="#2F7A6B" stroke-width="19" stroke-linecap="round" fill="none"/>
  </g>

  <!-- shared caddy at their feet -->
  <rect x="356" y="560" width="90" height="50" rx="8" fill="#E8623C"/>
  <path d="M376 560 q25 -26 50 0" stroke="#C74E2C" stroke-width="8" fill="none" stroke-linecap="round"/>
  <rect x="372" y="540" width="12" height="24" rx="3" fill="#FFFFFF"/>
  <rect x="392" y="535" width="12" height="29" rx="3" fill="#7FC4B4"/>
  <rect x="412" y="542" width="12" height="22" rx="3" fill="#FFFFFF"/>
</svg>
