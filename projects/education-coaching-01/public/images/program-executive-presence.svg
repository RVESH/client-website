  <rect width="560" height="420" fill="#EAE7F2"/>
  <rect y="330" width="560" height="90" fill="#DCD7E9"/>

  <!-- podium -->
  <path d="M240 420 L240 300 L320 300 L340 420 Z" fill="#1B2140"/>
  <rect x="236" y="290" width="88" height="16" rx="4" fill="#2A3160"/>

  <!-- speaker figure -->
  <g>
    <path d="M232 300 L232 240 C232 210 254 192 280 192 C306 192 328 210 328 240 L328 300 Z" fill="#2E9E6C"/>
