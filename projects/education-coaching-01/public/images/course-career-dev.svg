<svg viewBox="0 0 480 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="catCareerTitle">
  <title id="catCareerTitle">Career development course illustration with a door and pathway</title>
  <rect width="480" height="320" fill="#F1EDE3"/>
  <rect y="250" width="480" height="70" fill="#E4DECD"/>

  <!-- open door -->
  <rect x="180" y="60" width="120" height="200" rx="6" fill="#1B2140"/>
  <path d="M300 60 L300 260 L360 240 L360 80 Z" fill="#2A3160"/>
  <circle cx="285" cy="164" r="5" fill="#E8A33D"/>

  <!-- light beyond the door -->
  <rect x="196" y="76" width="88" height="168" fill="#FCEFC7" opacity="0.7"/>

  <!-- pathway leading to the door -->
  <path d="M40 260 L180 260 L200 200 L60 200 Z" fill="#DBD3BC" opacity="0.6"/>
  <line x1="120" y1="260" x2="150" y2="200" stroke="#E8A33D" stroke-width="4" stroke-dasharray="10 8" opacity="0.7"/>

  <!-- resume/document icon -->
  <rect x="70" y="130" width="60" height="70" rx="6" fill="#FFFFFF" stroke="#DBD3BC" stroke-width="2"/>
  <line x1="82" y1="148" x2="118" y2="148" stroke="#2E9E6C" stroke-width="3"/>
  <line x1="82" y1="160" x2="118" y2="160" stroke="#DBD3BC" stroke-width="3"/>
  <line x1="82" y1="172" x2="106" y2="172" stroke="#DBD3BC" stroke-width="3"/>
</svg>
