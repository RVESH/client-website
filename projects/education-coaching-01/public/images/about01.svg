<svg viewBox="0 0 600 450" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="aboutTitle">
  <title id="aboutTitle">Books and a growth chart representing the Keystone founding story</title>
  <rect width="600" height="450" fill="#F1EDE3"/>
  <rect y="330" width="600" height="120" fill="#E4DECD"/>

  <!-- shelf with books -->
  <rect x="60" y="300" width="480" height="10" fill="#1B2140"/>
  <g>
    <rect x="80" y="220" width="34" height="80" fill="#1B2140"/>
    <rect x="118" y="240" width="30" height="60" fill="#2E9E6C"/>
    <rect x="152" y="200" width="34" height="100" fill="#E8A33D"/>
    <rect x="190" y="230" width="28" height="70" fill="#4D5270"/>
    <rect x="222" y="250" width="30" height="50" fill="#1B2140"/>
  </g>

  <!-- open book on stand -->
  <g>
    <path d="M340 300 L340 240 Q380 224 420 240 L420 300 Z" fill="#FFFFFF" stroke="#DBD3BC" stroke-width="2"/>
    <path d="M380 240 L380 300" stroke="#DBD3BC" stroke-width="2"/>
    <line x1="352" y1="252" x2="372" y2="248" stroke="#B9B3A0" stroke-width="2"/>
    <line x1="352" y1="264" x2="372" y2="260" stroke="#B9B3A0" stroke-width="2"/>
    <line x1="388" y1="248" x2="408" y2="252" stroke="#B9B3A0" stroke-width="2"/>
    <line x1="388" y1="260" x2="408" y2="264" stroke="#B9B3A0" stroke-width="2"/>
  </g>

  <!-- growth chart panel -->
  <rect x="440" y="150" width="120" height="150" rx="10" fill="#1B2140"/>
  <polyline points="456,270 476,250 496,258 516,224 536,232 544,206" fill="none" stroke="#E8A33D" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="544" cy="206" r="5" fill="#2E9E6C"/>

  <!-- keystone arch motif -->
  <path d="M240 300 L280 190 L320 190 L360 300 Z" fill="none" stroke="#2E9E6C" stroke-width="5" stroke-linejoin="round" opacity="0.85"/>
  <line x1="300" y1="190" x2="300" y2="300" stroke="#E8A33D" stroke-width="5" stroke-linecap="round"/>

  <!-- highlighter accent -->
  <path d="M40 340 Q 100 322 170 336" stroke="#E8A33D" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.6"/>
</svg>
