<svg viewBox="0 0 600 450" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="contactTitle">
  <title id="contactTitle">A welcoming mentorship office space with a desk and plant</title>
  <rect width="600" height="450" fill="#F1EDE3"/>
  <rect width="600" height="300" fill="#E9E3D3"/>

  <!-- window -->
  <rect x="380" y="40" width="180" height="220" rx="8" fill="#FCEFC7" opacity="0.55"/>
  <line x1="470" y1="40" x2="470" y2="260" stroke="#1B2140" stroke-opacity="0.1" stroke-width="4"/>
  <line x1="380" y1="150" x2="560" y2="150" stroke="#1B2140" stroke-opacity="0.1" stroke-width="4"/>

  <!-- wall art: keystone motif -->
  <rect x="60" y="70" width="140" height="100" rx="8" fill="#FFFFFF" stroke="#DBD3BC" stroke-width="2"/>
  <path d="M100 150 L128 96 L152 96 L180 150 Z" fill="none" stroke="#2E9E6C" stroke-width="4" stroke-linejoin="round"/>
  <line x1="140" y1="96" x2="140" y2="150" stroke="#E8A33D" stroke-width="4" stroke-linecap="round"/>

  <!-- desk -->
  <rect x="0" y="280" width="600" height="26" fill="#1B2140"/>
  <rect x="0" y="306" width="600" height="144" fill="#E4DECD"/>
  <rect x="60" y="306" width="14" height="80" fill="#1B2140" opacity="0.15"/>
  <rect x="520" y="306" width="14" height="80" fill="#1B2140" opacity="0.15"/>

  <!-- laptop -->
  <rect x="230" y="252" width="100" height="8" rx="3" fill="#1B2140"/>
  <path d="M235 252 L245 210 L315 210 L325 252 Z" fill="#1B2140"/>
  <rect x="248" y="216" width="64" height="30" fill="#2E9E6C" opacity="0.85"/>

  <!-- coffee mug -->
  <rect x="360" y="240" width="26" height="26" rx="4" fill="#E8A33D"/>
  <path d="M386 246 q10 0 10 8 t-10 8" stroke="#E8A33D" stroke-width="3" fill="none"/>

  <!-- plant -->
  <rect x="500" y="230" width="46" height="56" rx="8" fill="#1B2140"/>
  <g fill="#2E9E6C">
    <ellipse cx="516" cy="204" rx="16" ry="28" transform="rotate(-15 516 204)"/>
    <ellipse cx="538" cy="200" rx="14" ry="26" transform="rotate(12 538 200)"/>
    <ellipse cx="527" cy="188" rx="13" ry="24"/>
  </g>

  <!-- chairs suggestion -->
  <rect x="140" y="330" width="60" height="70" rx="10" fill="#4D5270" opacity="0.35"/>
</svg>
