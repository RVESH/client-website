      <stop offset="100%" stop-color="#12141C"/>
    </linearGradient>
        <linearGradient id="panelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141822"/>
      <stop offset="100%" stop-color="#0F1218"/>
    </linearGradient>
        <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4C7CFF"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
        <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4C7CFF"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
      </defs>
      <rect width="820" height="480" rx="20" fill="url(#bgGrad)"/>
      <rect x="1" y="1" width="818" height="478" rx="19" fill="none" stroke="#242938"/>

