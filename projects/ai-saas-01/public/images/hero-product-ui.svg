        <circle cx="560" cy="70" r="5" fill="#4C7CFF"/><circle cx="660" cy="110" r="5" fill="#8B5CF6"/><circle cx="620" cy="190" r="5" fill="#4C7CFF"/><circle cx="720" cy="220" r="5" fill="#8B5CF6"/><circle cx="600" cy="260" r="5" fill="#4C7CFF"/>
