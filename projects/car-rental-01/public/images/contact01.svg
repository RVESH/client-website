<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="contactTitle">
  <title id="contactTitle">A car parked outside the rental counter at dusk</title>
  <defs>
    <linearGradient id="contactSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A2438"/>
      <stop offset="1" stop-color="#4A3A3A"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#contactSky)"/>

  <!-- building facade -->
  <rect x="0" y="260" width="800" height="220" fill="#1C1F26"/>
  <rect x="0" y="250" width="800" height="16" fill="#0A0B0E"/>

  <!-- glass storefront -->
  <rect x="60" y="290" width="680" height="160" rx="6" fill="#2B3A55" opacity="0.6"/>
  <line x1="260" y1="290" x2="260" y2="450" stroke="#0A0B0E" stroke-width="4"/>
  <line x1="460" y1="290" x2="460" y2="450" stroke="#0A0B0E" stroke-width="4"/>
  <line x1="620" y1="290" x2="620" y2="450" stroke="#0A0B0E" stroke-width="4"/>

  <!-- illuminated sign -->
  <rect x="330" y="220" width="140" height="34" rx="8" fill="#E7C98C"/>
  <rect x="352" y="232" width="96" height="10" rx="4" fill="#8F6A2E"/>

  <!-- lot / ground -->
  <rect x="0" y="480" width="800" height="120" fill="#14161B"/>
  <path d="M40 540 L760 540" stroke="#E7C98C" stroke-width="4" stroke-dasharray="22 18" opacity="0.6"/>

  <!-- parked car facing forward -->
  <g>
    <ellipse cx="400" cy="522" rx="130" ry="14" fill="#0A0B0E" opacity="0.5"/>
    <path d="M270 520 L282 486 C288 472 302 464 318 464 L340 464 L356 448 C361 443 368 440 375 440 L425 440 C432 440 439 443 444 449 L460 464 L482 464 C500 464 516 476 520 492 L530 520 Z" fill="#BD8A3D"/>
    <path d="M362 460 L374 447 C378 443 383 440 388 440 L412 440 C417 440 422 443 426 448 L436 460 Z" fill="#16222C"/>
    <line x1="400" y1="464" x2="400" y2="517" stroke="#8F6A2E" stroke-width="2"/>

    <circle cx="322" cy="524" r="30" fill="#0A0B0E"/>
    <circle cx="322" cy="524" r="14" fill="#D8DADE"/>
    <circle cx="478" cy="524" r="30" fill="#0A0B0E"/>
    <circle cx="478" cy="524" r="14" fill="#D8DADE"/>

    <!-- headlights on -->
    <ellipse cx="278" cy="498" rx="9" ry="12" fill="#F5EBD9"/>
    <ellipse cx="522" cy="498" rx="9" ry="12" fill="#C4462E"/>
    <path d="M270 500 L210 530 L270 512 Z" fill="#F5EBD9" opacity="0.3"/>
  </g>

  <!-- stars -->
  <g fill="#F5EBD9">
    <circle cx="100" cy="60" r="2"/>
    <circle cx="160" cy="100" r="1.5"/>
    <circle cx="700" cy="70" r="1.5"/>
    <circle cx="650" cy="120" r="1.5"/>
  </g>
</svg>
