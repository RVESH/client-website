<svg viewBox="0 0 720 640" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="heroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3EEE4"/>
      <stop offset="100%" stop-color="#FAF7F2"/>
    </linearGradient>
        <linearGradient id="chairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1EBDD"/>
    </linearGradient>
        <linearGradient id="archGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CFE1DC"/>
      <stop offset="100%" stop-color="#E7F0EC"/>
    </linearGradient>
        <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3F7C70"/>
      <stop offset="100%" stop-color="#1F5C52"/>
    </linearGradient>
      </defs>
      <rect width="720" height="640" fill="url(#heroBg)"/>

      <!-- window arch -->
      <path d="M120 560 L120 260 A240 240 0 0 1 600 260 L600 560 Z" fill="url(#archGrad)" opacity="0.6"/>

      <!-- floor line -->
      <line x1="60" y1="560" x2="660" y2="560" stroke="#E6DFD0" stroke-width="2"/>

      <!-- dental chair, simplified -->
      <rect x="260" y="360" width="200" height="26" rx="13" fill="url(#chairGrad)" stroke="#E6DFD0"/>
      <rect x="300" y="300" width="120" height="70" rx="18" fill="url(#chairGrad)" stroke="#E6DFD0"/>
      <rect x="330" y="386" width="60" height="120" rx="14" fill="url(#chairGrad)" stroke="#E6DFD0"/>
      <rect x="300" y="500" width="120" height="18" rx="9" fill="#D4B383" opacity="0.5"/>

      <!-- overhead lamp -->
      <line x1="360" y1="120" x2="360" y2="230" stroke="#E6DFD0" stroke-width="3"/>
      <ellipse cx="360" cy="240" rx="46" ry="16" fill="#FFFFFF" stroke="#E6DFD0"/>
      <ellipse cx="360" cy="240" rx="26" ry="9" fill="#D4B383" opacity="0.5"/>

      <!-- potted plant -->
      <rect x="560" y="470" width="46" height="60" rx="8" fill="#FFFFFF" stroke="#E6DFD0"/>
      <path d="M583 470 C 560 440 560 410 583 390 C 606 410 606 440 583 470 Z" fill="url(#leafGrad)" opacity="0.85"/>
      <path d="M583 470 C 605 445 610 415 590 395" fill="none" stroke="#1F5C52" stroke-width="2" opacity="0.4"/>

      <!-- small side table -->
      <rect x="150" y="470" width="70" height="12" rx="6" fill="#FFFFFF" stroke="#E6DFD0"/>
      <line x1="160" y1="482" x2="160" y2="520" stroke="#E6DFD0" stroke-width="3"/>
      <line x1="210" y1="482" x2="210" y2="520" stroke="#E6DFD0" stroke-width="3"/>

      <!-- soft tooth mark motif -->
      <path d="M575.0 95.0
      C 572.5 85.0 592.5 82.5 600 87.5
      C 607.5 82.5 627.5 85.0 625.0 95.0
      C 627.5 125.0 617.5 170.0 608.0 190.0
      C 605.0 197.5 595.0 197.5 592.0 190.0
      C 582.5 170.0 572.5 125.0 575.0 95.0 Z"
      fill="#1F5C52" opacity="0.14"/>
      <path d="M73.0 169.4
      C 71.3 162.6 84.9 160.9 90 164.3
      C 95.1 160.9 108.7 162.6 107.0 169.4
      C 108.7 189.8 101.9 220.4 95.44 234.0
      C 93.4 239.1 86.6 239.1 84.56 234.0
      C 78.1 220.4 71.3 189.8 73.0 169.4 Z"
      fill="#B8935A" opacity="0.16"/>
    </svg>
