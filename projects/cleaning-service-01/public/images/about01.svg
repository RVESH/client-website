<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="aboutTitle">
  <title id="aboutTitle">Brightside team preparing supplies before a home visit</title>
  <rect width="800" height="600" fill="#F4F6F1"/>
  <rect width="800" height="420" fill="#EAEFE7"/>

  <!-- van back doors, open -->
  <rect x="30" y="120" width="260" height="300" rx="14" fill="#204F45"/>
  <rect x="55" y="150" width="90" height="230" rx="8" fill="#2F7A6B"/>
  <rect x="165" y="150" width="90" height="230" rx="8" fill="#2F7A6B"/>
  <circle cx="140" cy="265" r="5" fill="#F4F6F1"/>
  <circle cx="170" cy="265" r="5" fill="#F4F6F1"/>

  <!-- crates with supplies -->
  <rect x="80" y="360" width="70" height="50" rx="6" fill="#E8623C"/>
  <rect x="170" y="365" width="60" height="45" rx="6" fill="#7FC4B4"/>

  <!-- ground -->
  <rect x="0" y="420" width="800" height="180" fill="#DCE3D8"/>

  <!-- figure 1 carrying caddy -->
  <g>
    <path d="M380 600 L380 470 C380 430 415 405 450 405 C485 405 515 430 515 470 L515 600 Z" fill="#2F7A6B"/>
    <path d="M405 435 L495 435 L487 555 L413 555 Z" fill="#E3EEE9"/>
    <circle cx="450" cy="388" r="42" fill="#D9A876"/>
    <path d="M409 375 a42 42 0 0 1 84 0 q-6 -20 -42 -20 t-42 20 z" fill="#1C2521"/>
    <path d="M420 440 C 390 440, 365 450, 350 470" stroke="#2F7A6B" stroke-width="24" stroke-linecap="round" fill="none"/>
  </g>

  <!-- caddy -->
  <rect x="300" y="460" width="90" height="50" rx="8" fill="#E8623C"/>
  <path d="M320 460 q25 -26 50 0" stroke="#C74E2C" stroke-width="8" fill="none" stroke-linecap="round"/>
  <rect x="315" y="440" width="14" height="26" rx="3" fill="#FFFFFF"/>
  <rect x="335" y="435" width="14" height="31" rx="3" fill="#7FC4B4"/>
  <rect x="355" y="442" width="14" height="24" rx="3" fill="#FFFFFF"/>

  <!-- figure 2 -->
  <g>
    <path d="M560 600 L560 480 C560 440 590 415 622 415 C654 415 684 440 684 480 L684 600 Z" fill="#204F45"/>
    <path d="M584 448 L662 448 L655 555 L590 555 Z" fill="#E3EEE9"/>
    <circle cx="622" cy="400" r="40" fill="#D9A876"/>
    <path d="M583 388 a40 40 0 0 1 79 0 q-6 -19 -39 -19 t-39 19 z" fill="#1C2521"/>
    <path d="M650 448 C 670 440, 685 425, 690 405" stroke="#204F45" stroke-width="22" stroke-linecap="round" fill="none"/>
  </g>

  <!-- clipboard -->
  <rect x="672" y="380" width="34" height="44" rx="4" fill="#FFFFFF"/>
  <line x1="678" y1="392" x2="700" y2="392" stroke="#DCE3D8" stroke-width="3"/>
  <line x1="678" y1="402" x2="700" y2="402" stroke="#DCE3D8" stroke-width="3"/>
  <line x1="678" y1="412" x2="694" y2="412" stroke="#DCE3D8" stroke-width="3"/>
</svg>
