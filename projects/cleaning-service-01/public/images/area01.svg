<svg viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="areaTitle">
  <title id="areaTitle">Tree-lined residential street in one of our service neighborhoods</title>
  <defs>
    <linearGradient id="areaSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FCEFC7"/>
      <stop offset="1" stop-color="#F4F6F1"/>
    </linearGradient>
  </defs>
  <rect width="900" height="600" fill="url(#areaSky)"/>

  <!-- road -->
  <rect x="0" y="440" width="900" height="160" fill="#DCE3D8"/>
  <rect x="0" y="440" width="900" height="10" fill="#B9C4B4"/>
  <g stroke="#F4F6F1" stroke-width="6" stroke-dasharray="30 22">
    <line x1="0" y1="520" x2="900" y2="520"/>
  </g>

  <!-- houses -->
  <g>
    <rect x="60" y="300" width="150" height="140" fill="#2F7A6B"/>
    <path d="M50 300 L135 235 L220 300 Z" fill="#204F45"/>
    <rect x="100" y="360" width="40" height="80" fill="#F4F6F1"/>
    <rect x="160" y="330" width="34" height="34" fill="#F4F6F1"/>
  </g>

  <g>
    <rect x="250" y="330" width="130" height="110" fill="#E3EEE9"/>
    <path d="M240 330 L315 280 L390 330 Z" fill="#7FC4B4"/>
    <rect x="285" y="380" width="36" height="60" fill="#204F45"/>
    <rect x="335" y="355" width="28" height="28" fill="#204F45"/>
  </g>

  <g>
    <rect x="620" y="310" width="150" height="130" fill="#EAEFE7"/>
    <path d="M610 310 L695 250 L780 310 Z" fill="#2F7A6B"/>
    <rect x="660" y="370" width="40" height="70" fill="#204F45"/>
    <rect x="720" y="340" width="30" height="30" fill="#204F45"/>
  </g>

  <!-- trees -->
  <g>
    <rect x="430" y="380" width="14" height="60" fill="#204F45"/>
    <circle cx="437" cy="360" r="42" fill="#2F7A6B"/>
    <circle cx="410" cy="380" r="30" fill="#7FC4B4" opacity="0.8"/>
    <circle cx="465" cy="385" r="30" fill="#7FC4B4" opacity="0.8"/>
  </g>

  <g>
    <rect x="820" y="390" width="12" height="50" fill="#204F45"/>
    <circle cx="826" cy="372" r="34" fill="#2F7A6B"/>
  </g>

  <g>
    <rect x="30" y="400" width="10" height="40" fill="#204F45"/>
    <circle cx="35" cy="386" r="26" fill="#2F7A6B"/>
  </g>

  <!-- Brightside van on the street -->
  <g>
    <rect x="470" y="470" width="150" height="60" rx="10" fill="#FFFFFF" stroke="#DCE3D8" stroke-width="3"/>
    <rect x="470" y="450" width="70" height="40" rx="8" fill="#FFFFFF" stroke="#DCE3D8" stroke-width="3"/>
    <rect x="480" y="458" width="40" height="24" rx="3" fill="#EAEFE7"/>
    <circle cx="500" cy="532" r="14" fill="#1C2521"/>
    <circle cx="590" cy="532" r="14" fill="#1C2521"/>
    <path d="M480 505 C 510 495, 540 495, 560 505" stroke="#E8623C" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.7"/>
  </g>
</svg>
