<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="s2Title">
  <title id="s2Title">Cleaner scrubbing bathroom tile during a deep clean</title>
  <rect width="800" height="600" fill="#F4F6F1"/>

  <!-- tile wall -->
  <g fill="#EAEFE7" stroke="#DCE3D8" stroke-width="3">
    <rect x="0" y="0" width="800" height="420"/>
  </g>
  <g stroke="#FFFFFF" stroke-width="4">
    <line x1="0" y1="70" x2="800" y2="70"/>
    <line x1="0" y1="140" x2="800" y2="140"/>
    <line x1="0" y1="210" x2="800" y2="210"/>
    <line x1="0" y1="280" x2="800" y2="280"/>
    <line x1="0" y1="350" x2="800" y2="350"/>
    <line x1="100" y1="0" x2="100" y2="420"/>
    <line x1="220" y1="0" x2="220" y2="420"/>
    <line x1="340" y1="0" x2="340" y2="420"/>
    <line x1="460" y1="0" x2="460" y2="420"/>
    <line x1="580" y1="0" x2="580" y2="420"/>
    <line x1="700" y1="0" x2="700" y2="420"/>
  </g>

  <!-- grout being scrubbed highlight -->
  <rect x="460" y="140" width="120" height="70" fill="none" stroke="#7FC4B4" stroke-width="5" stroke-dasharray="2 10" stroke-linecap="round"/>

  <!-- tub -->
  <rect x="0" y="420" width="800" height="60" fill="#FFFFFF"/>
  <rect x="0" y="410" width="800" height="14" fill="#DCE3D8"/>

  <!-- figure kneeling, scrubbing -->
  <g>
    <path d="M470 600 C470 560 480 520 520 500 L620 500 C650 510 660 540 660 560 L660 600 Z" fill="#2F7A6B"/>
    <circle cx="560" cy="440" r="40" fill="#D9A876"/>
    <path d="M521 428 a40 40 0 0 1 80 0 q-6 -19 -40 -19 t-40 19 z" fill="#1C2521"/>
    <!-- arm scrubbing up on tile -->
    <path d="M560 480 C 530 460, 505 240, 500 190" stroke="#2F7A6B" stroke-width="24" stroke-linecap="round" fill="none"/>
    <circle cx="500" cy="182" r="14" fill="#D9A876"/>
  </g>

  <!-- scrub brush -->
  <rect x="486" y="168" width="30" height="16" rx="4" fill="#E8623C"/>

  <!-- bucket -->
  <path d="M330 540 L360 540 L352 600 L306 600 Z" fill="#E8623C"/>
  <ellipse cx="345" cy="540" rx="15" ry="6" fill="#C74E2C"/>

  <!-- suds -->
  <g fill="#FFFFFF" opacity="0.9">
    <circle cx="330" cy="530" r="8"/>
    <circle cx="345" cy="522" r="6"/>
    <circle cx="358" cy="533" r="5"/>
  </g>

  <rect x="0" y="560" width="800" height="40" fill="#DCE3D8"/>
</svg>
